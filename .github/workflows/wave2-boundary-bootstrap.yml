name: Wave2 development boundary bootstrap

on:
  push:
    branches:
      - codex/devspace-development-boundaries-wave2-20260914

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/devspace-development-boundaries-wave2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply bounded source transform
        run: python3 scripts/wave2-boundary-bootstrap.py
      - name: Install dependencies
        run: npm ci
      - name: Verify focused boundaries and full source path
        run: |
          set -euo pipefail
          npx tsx src/development-boundaries.test.ts
          npx tsx src/local-agent-errors.test.ts
          npx tsx src/durable-operations-ci.test.ts
          npm run typecheck
          npm run build
          npm test
          git diff --check
      - name: Commit bounded implementation and remove bootstrap files
        run: |
          set -euo pipefail
          rm .github/workflows/wave2-boundary-bootstrap.yml scripts/wave2-boundary-bootstrap.py
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src docs package.json .github/workflows/wave2-boundary-bootstrap.yml scripts/wave2-boundary-bootstrap.py
          git commit -m 'refactor: resolve development boundary wave 2'
          git push origin HEAD:codex/devspace-development-boundaries-wave2-20260914
