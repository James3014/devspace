name: Wave2 development boundary bootstrap

on:
  push:
    branches: [codex/devspace-development-boundaries-wave2-20260914]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/devspace-development-boundaries-wave2-20260914
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply exact boundary extraction
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              assert count == 1, f"{label}: expected exactly one match, got {count}"
              return text.replace(old, new, 1)

          # 1. Move shared secret redaction out of provider-layer local-agent-errors.
          errors_path = Path("src/local-agent-errors.ts")
          errors = errors_path.read_text()
          errors = replace_once(
              errors,
              '} from "better-result";\nimport {\n  isLocalAgentProvider,',
              '} from "better-result";\nimport { redactSensitiveText } from "./sensitive-text.js";\nimport {\n  isLocalAgentProvider,',
              "local-agent-errors neutral import",
          )
          redaction_start_marker = "/**\n * Redact provider material only after it has been decoded/assembled. Provider"
          redaction_end_marker = "\nexport function isAgentDaemonError"
          start = errors.index(redaction_start_marker)
          end = errors.index(redaction_end_marker, start)
          redaction_block = errors[start:end].rstrip() + "\n"
          errors = errors[:start] + 'export { redactSensitiveText } from "./sensitive-text.js";\n' + errors[end:]
          errors_path.write_text(errors)
          Path("src/sensitive-text.ts").write_text(
              "/** Shared bounded redaction for diagnostics crossing control/provider boundaries. */\n\n"
              + redaction_block
          )

          host_path = Path("src/host-operations.ts")
          host = host_path.read_text()
          host = replace_once(
              host,
              'import { redactSensitiveText } from "./local-agent-errors.js";',
              'import { redactSensitiveText } from "./sensitive-text.js";',
              "host neutral redaction import",
          )
          host_path.write_text(host)

          # 2. Remove ChatSwarm strategy implementation from neutral durable control.
          durable_path = Path("src/durable-operations.ts")
          durable = durable_path.read_text()
          durable = replace_once(
              durable,
              'import { ChatSwarmStore, type ChatSwarmMigrationBundle, type ChatSwarmMigrationReadback } from "./chat-swarm-store.js";\n',
              "",
              "durable ChatSwarm import",
          )
          durable = replace_once(
              durable,
              'import type { ControlPlaneServiceBinding } from "./control-plane-convergence.js";\n',
              "",
              "durable migration binding import",
          )
          interface_start = durable.index("export interface ChatSwarmMigrationPreparation {")
          interface_end = durable.index("export type CommandRunner", interface_start)
          durable = durable[:interface_start] + durable[interface_end:]
          methods_start = durable.index("  prepareChatSwarmMigration(")
          methods_end = durable.index("  private async executeNexusGatewayRecovery(", methods_start)
          durable = durable[:methods_start] + durable[methods_end:]
          helper_start = durable.index("function migrationReadbackMatches(")
          helper_end = durable.index("function stableOperationId(", helper_start)
          durable = durable[:helper_start] + durable[helper_end:]
          operation_id_start = durable.index("export function chatSwarmMigrationOperationId(")
          operation_id_end = durable.index("function hashJson(", operation_id_start)
          durable = durable[:operation_id_start] + durable[operation_id_end:]
          durable_path.write_text(durable)

          migration_module = r'''import { createHash } from "node:crypto";
          import { resolve } from "node:path";
          import { isDeepStrictEqual } from "node:util";
          import type { ControlPlaneServiceBinding } from "./control-plane-convergence.js";
          import {
            DurableOperationError,
            type DurableOperationRecord,
            type DurableOperationStore,
          } from "./durable-operations.js";
          import {
            ChatSwarmStore,
            type ChatSwarmMigrationBundle,
            type ChatSwarmMigrationReadback,
          } from "./chat-swarm-store.js";

          export interface ChatSwarmMigrationPreparation {
            operationId: string;
            requestHash: string;
            bundle: ChatSwarmMigrationBundle;
            destinationBinding: ControlPlaneServiceBinding;
            preReadback?: ChatSwarmMigrationReadback;
          }

          /**
           * Replaceable ChatSwarm migration strategy over the neutral durable-operation ledger.
           * The durable store owns effect identity/terminal truth; this coordinator owns only
           * ChatSwarm domain translation and exact destination readback.
           */
          export class ChatSwarmMigrationCoordinator {
            constructor(
              private readonly store: DurableOperationStore,
              private readonly stateDirectory: string,
            ) {}

            prepare(input: {
              attemptKey: string;
              bundle: ChatSwarmMigrationBundle;
              destinationBinding: ControlPlaneServiceBinding;
            }): ChatSwarmMigrationPreparation {
              assertAttemptKey(input.attemptKey);
              const expectedOperationId = chatSwarmMigrationOperationId(
                this.stateDirectory,
                input.attemptKey,
              );
              if (input.bundle.operationId !== expectedOperationId) {
                throw new DurableOperationError(
                  "OPERATION_REPLAY_CONFLICT",
                  "migration bundle operationId is not bound to the exact attemptKey",
                );
              }
              if (
                JSON.stringify(sortJson(input.bundle.destinationBinding))
                !== JSON.stringify(sortJson(input.destinationBinding))
              ) {
                throw new DurableOperationError(
                  "RECONCILIATION_REQUIRED",
                  "migration destination identity does not match the requested canonical binding",
                );
              }
              const request = {
                schema: "devspace.chat_swarm_migration_request.v1",
                operationId: expectedOperationId,
                contentHash: input.bundle.contentHash,
                sourceBinding: input.bundle.sourceBinding,
                destinationBinding: input.destinationBinding,
                counts: {
                  swarms: input.bundle.swarms.length,
                  workers: input.bundle.workers.length,
                  tasks: input.bundle.tasks.length,
                  attempts: input.bundle.attempts.length,
                  carrierOperations: input.bundle.carrierOperations.length,
                },
              };
              const requestHash = hashJson(request);
              const { record } = this.store.createOrReplay({
                operationId: expectedOperationId,
                attemptKey: input.attemptKey,
                requestHash,
                kind: "chat_swarm_reconciliation",
                authorityMode: "OWNER_DIRECT",
                scopeRoot: this.stateDirectory,
                request,
              });
              if (record.requestHash !== requestHash) {
                throw new DurableOperationError(
                  "OPERATION_REPLAY_CONFLICT",
                  "migration request hash changed",
                  record,
                );
              }
              return {
                operationId: expectedOperationId,
                requestHash,
                bundle: input.bundle,
                destinationBinding: input.destinationBinding,
              };
            }

            apply(
              preparation: ChatSwarmMigrationPreparation,
              destinationStore: ChatSwarmStore,
            ): DurableOperationRecord {
              const record = this.store.getByOperationId(preparation.operationId);
              if (
                !record
                || record.kind !== "chat_swarm_reconciliation"
                || record.requestHash !== preparation.requestHash
              ) {
                throw new DurableOperationError(
                  "RECONCILIATION_REQUIRED",
                  "migration operation identity is not present in the canonical durable ledger",
                );
              }
              if (record.status === "succeeded" || record.status === "failed") return record;
              if (record.status === "outcome_unknown") {
                throw new DurableOperationError(
                  "OPERATION_OUTCOME_UNKNOWN",
                  "migration effect is unknown; reconcile the exact destination readback before another effect",
                  record,
                );
              }
              let preReadback: ChatSwarmMigrationReadback;
              try {
                preReadback = destinationStore.readMigrationReadback(preparation.bundle);
                const postReadback = destinationStore.importMigrationBundle(
                  preparation.bundle,
                  preparation.destinationBinding,
                );
                if (!migrationReadbackMatches(preparation.bundle, postReadback)) {
                  return this.store.finish(preparation.operationId, {
                    status: "outcome_unknown",
                    retrySafe: false,
                    errorCode: "RECONCILIATION_REQUIRED",
                    errorMessage: "migration post-readback did not prove the exact domain bundle",
                    receipt: {
                      preReadback,
                      postReadback,
                      contentHash: preparation.bundle.contentHash,
                    },
                  });
                }
                return this.store.finish(preparation.operationId, {
                  status: "succeeded",
                  retrySafe: false,
                  receipt: {
                    schema: "devspace.chat_swarm_migration_receipt.v1",
                    sourceBinding: preparation.bundle.sourceBinding,
                    destinationBinding: preparation.destinationBinding,
                    contentHash: preparation.bundle.contentHash,
                    preReadback,
                    postReadback,
                    unresolvedTaskIds: postReadback.unresolvedTaskIds,
                  },
                });
              } catch (error) {
                return this.store.finish(preparation.operationId, {
                  status: "failed",
                  retrySafe: false,
                  errorCode: "MIGRATION_APPLY_FAILED",
                  errorMessage: redactSecrets(error instanceof Error ? error.message : String(error)),
                });
              }
            }

            reconcile(
              preparation: ChatSwarmMigrationPreparation,
              destinationStore: ChatSwarmStore,
            ): DurableOperationRecord {
              const record = this.store.getByOperationId(preparation.operationId);
              if (
                !record
                || record.kind !== "chat_swarm_reconciliation"
                || record.requestHash !== preparation.requestHash
              ) {
                throw new DurableOperationError(
                  "RECONCILIATION_REQUIRED",
                  "migration reconciliation requires the exact durable operation identity",
                );
              }
              if (record.status !== "outcome_unknown") return record;
              const readback = destinationStore.readMigrationReadback(preparation.bundle);
              if (!migrationReadbackMatches(preparation.bundle, readback)) return record;
              return this.store.finish(preparation.operationId, {
                status: "succeeded",
                retrySafe: false,
                receipt: {
                  ...(record.receipt ?? {}),
                  reconciliation: "physical_readback",
                  postReadback: readback,
                },
              });
            }
          }

          export function chatSwarmMigrationOperationId(
            destinationStateDirectory: string,
            attemptKey: string,
          ): string {
            assertAttemptKey(attemptKey);
            return stableOperationId(
              "chat_swarm_reconciliation",
              destinationStateDirectory,
              attemptKey,
            );
          }

          function assertAttemptKey(value: string): void {
            if (!/^[A-Za-z0-9][A-Za-z0-9._:/-]{0,127}$/.test(value)) {
              throw new DurableOperationError(
                "INVALID_ATTEMPT_KEY",
                "attemptKey must be a bounded stable operation identity.",
              );
            }
          }

          function migrationReadbackMatches(
            bundle: ChatSwarmMigrationBundle,
            readback: ChatSwarmMigrationReadback,
          ): boolean {
            const expectedUnresolved = bundle.tasks
              .filter((task) => task.lifecycleState === "RECONCILE_REQUIRED")
              .map((task) => task.id)
              .sort();
            return readback.operationId === bundle.operationId
              && readback.contentHash === bundle.contentHash
              && readback.counts.swarms === bundle.swarms.length
              && readback.counts.workers === bundle.workers.length
              && readback.counts.tasks === bundle.tasks.length
              && readback.counts.attempts === bundle.attempts.length
              && readback.counts.carrierOperations === bundle.carrierOperations.length
              && isDeepStrictEqual(readback.unresolvedTaskIds, expectedUnresolved);
          }

          function stableOperationId(
            kind: "chat_swarm_reconciliation",
            scopeRoot: string,
            attemptKey: string,
          ): string {
            return `op_${createHash("sha256")
              .update(`${kind}\0${resolve(scopeRoot)}\0${attemptKey}`)
              .digest("hex")
              .slice(0, 16)}`;
          }

          function hashJson(value: unknown): string {
            return createHash("sha256").update(JSON.stringify(sortJson(value))).digest("hex");
          }

          function sortJson(value: unknown): unknown {
            if (Array.isArray(value)) return value.map(sortJson);
            if (value && typeof value === "object") {
              return Object.fromEntries(
                Object.entries(value as Record<string, unknown>)
                  .filter(([, child]) => child !== undefined)
                  .sort(([a], [b]) => a.localeCompare(b))
                  .map(([key, child]) => [key, sortJson(child)]),
              );
            }
            return value;
          }

          function redactSecrets(value: string): string {
            return value
              .replace(/(https?:\/\/)[^/@\s]+@/gi, "$1[redacted]@")
              .replace(/([?&](?:token|access_token|password|secret)=)[^&\s]+/gi, "$1[redacted]");
          }
          '''
          Path("src/chat-swarm-migration.ts").write_text(
              "\n".join(line[10:] if line.startswith("          ") else line for line in migration_module.splitlines()) + "\n"
          )

          # 3. Wire strategy at the composition root only.
          server_path = Path("src/server.ts")
          server = server_path.read_text()
          server = replace_once(
              server,
              '  DurableOperationManager,\n  chatSwarmMigrationOperationId,\n  planCutoverStart,',
              '  DurableOperationManager,\n  planCutoverStart,',
              "server durable import",
          )
          server = replace_once(
              server,
              'import type { ChatSwarmStore, ChatSwarmMigrationBundle } from "./chat-swarm-store.js";\n',
              'import type { ChatSwarmStore, ChatSwarmMigrationBundle } from "./chat-swarm-store.js";\nimport { ChatSwarmMigrationCoordinator, chatSwarmMigrationOperationId } from "./chat-swarm-migration.js";\n',
              "server migration import",
          )
          server = replace_once(
              server,
              '  chatSwarmStore: ChatSwarmStore,\n  controlPlaneEvaluator?:',
              '  chatSwarmStore: ChatSwarmStore,\n  stateDirectory: string,\n  controlPlaneEvaluator?:',
              "migration registration signature",
          )
          server = replace_once(
              server,
              '): void {\n  const bindingShape = {',
              '): void {\n  const migrations = new ChatSwarmMigrationCoordinator(durableOperations.store, stateDirectory);\n  const bindingShape = {',
              "migration coordinator construction",
          )
          server = server.replace(
              "durableOperations.prepareChatSwarmMigration(",
              "migrations.prepare(",
          )
          server = server.replace(
              "durableOperations.applyChatSwarmMigration(",
              "migrations.apply(",
          )
          server = server.replace(
              "durableOperations.reconcileChatSwarmMigration(",
              "migrations.reconcile(",
          )
          assert "prepareChatSwarmMigration" not in server
          assert "applyChatSwarmMigration" not in server
          assert "reconcileChatSwarmMigration" not in server
          server = replace_once(
              server,
              '      chatSwarmLifecycle.store,\n      cutoverControl?.controlPlaneEvaluator,',
              '      chatSwarmLifecycle.store,\n      config.stateDir,\n      cutoverControl?.controlPlaneEvaluator,',
              "migration state directory wiring",
          )
          server_path.write_text(server)

          # 4. Move migration behavior test to the extracted strategy coordinator.
          test_path = Path("src/durable-operations.test.ts")
          test_source = test_path.read_text()
          test_source = replace_once(
              test_source,
              'import { ChatSwarmStore } from "./chat-swarm-store.js";\n',
              'import { ChatSwarmStore } from "./chat-swarm-store.js";\nimport { ChatSwarmMigrationCoordinator, chatSwarmMigrationOperationId } from "./chat-swarm-migration.js";\n',
              "migration test strategy import",
          )
          test_source = replace_once(
              test_source,
              '  DurableOperationStore,\n  chatSwarmMigrationOperationId,\n  NEXUS_GATEWAY_ACCEPTED_MANAGER_SHA256,',
              '  DurableOperationStore,\n  NEXUS_GATEWAY_ACCEPTED_MANAGER_SHA256,',
              "migration test durable import",
          )
          test_source = replace_once(
              test_source,
              '    const manager = new DurableOperationManager(canonicalConfig);\n    try {\n      const preparation = manager.prepareChatSwarmMigration({ attemptKey, bundle, destinationBinding });',
              '    const manager = new DurableOperationManager(canonicalConfig);\n    const migrations = new ChatSwarmMigrationCoordinator(manager.store, canonicalConfig.stateDir);\n    try {\n      const preparation = migrations.prepare({ attemptKey, bundle, destinationBinding });',
              "migration test coordinator",
          )
          test_source = test_source.replace("manager.applyChatSwarmMigration(", "migrations.apply(")
          test_source = test_source.replace("manager.prepareChatSwarmMigration(", "migrations.prepare(")
          test_source = test_source.replace("manager.reconcileChatSwarmMigration(", "migrations.reconcile(")
          assert "prepareChatSwarmMigration" not in test_source
          assert "applyChatSwarmMigration" not in test_source
          assert "reconcileChatSwarmMigration" not in test_source
          test_path.write_text(test_source)

          # 5. Promote the now-clean control modules and retire explicit debt.
          boundaries_path = Path("src/development-boundaries.ts")
          boundaries = boundaries_path.read_text()
          boundaries = replace_once(
              boundaries,
              '  "host-operation-policy.ts",\n  "process-platform.ts",',
              '  "host-operation-policy.ts",\n  "process-platform.ts",\n  "sensitive-text.ts",\n  "durable-operations.ts",\n  "host-operations.ts",',
              "control kernel promotion",
          )
          debt_start = boundaries.index("export const DEVELOPMENT_BOUNDARY_DEBT = [")
          debt_end_marker = "] as const;"
          debt_end = boundaries.index(debt_end_marker, debt_start) + len(debt_end_marker)
          typed_empty_debt = '''export const DEVELOPMENT_BOUNDARY_DEBT: ReadonlyArray<{
            module: string;
            role: "MIXED_DEBT";
            reason: string;
          }> = [];'''
          boundaries = boundaries[:debt_start] + typed_empty_debt + boundaries[debt_end:]
          boundaries_path.write_text(boundaries)

          # 6. Make the boundary regression part of the normal test command.
          package_path = Path("package.json")
          package = package_path.read_text()
          package = replace_once(
              package,
              'npm run test:physical-host-registry && npm run test:carrier-binding',
              'npm run test:physical-host-registry && tsx src/development-boundaries.test.ts && npm run test:carrier-binding',
              "npm test boundary wiring",
          )
          package_path.write_text(package)

          # 7. Record the resolved direction in developer documentation.
          docs_path = Path("docs/development-boundaries.md")
          docs = docs_path.read_text()
          docs_start = docs.index("## Current migration debt")
          docs_end = docs.index("## Dependency rule", docs_start)
          resolved = '''## Resolved second-wave debt

The first boundary slice recorded two mixed dependencies. The second wave resolves them without changing authority semantics:

- shared bounded diagnostic redaction lives in `sensitive-text.ts`, so both provider adapters and host control can consume a neutral utility without control importing `local-agent-*`;
- ChatSwarm migration preparation/apply/reconcile lives in `chat-swarm-migration.ts`, a replaceable strategy-side coordinator that consumes the neutral `DurableOperationStore`;
- `durable-operations.ts` remains the durable operation ledger and generic effect/reconciliation substrate; it no longer imports ChatSwarm implementation modules;
- `host-operations.ts` consumes only neutral control/infrastructure dependencies and is promoted with `durable-operations.ts` into the clean control kernel;
- `server.ts` remains the composition root that wires durable control and ChatSwarm migration strategy together.

The migration operation kind and receipt schemas remain backward compatible. `OUTCOME_UNKNOWN` still does not authorize replay, and physical destination readback remains required for migration reconciliation.

Future mixed dependencies must be recorded explicitly as new debt rather than weakening the dependency fence.

'''
          docs = docs[:docs_start] + resolved + docs[docs_end:]
          docs_path.write_text(docs)

          # Explicit structural assertions before executing tests.
          durable_after = durable_path.read_text()
          host_after = host_path.read_text()
          assert './chat-swarm-' not in durable_after
          assert './local-agent-' not in host_after
          assert '"durable-operations.ts"' in boundaries_path.read_text()
          assert '"host-operations.ts"' in boundaries_path.read_text()
          PY
      - name: Install dependencies
        run: npm ci
      - name: Verify focused boundaries
        run: |
          set -euo pipefail
          npx tsx src/development-boundaries.test.ts
          npx tsx src/local-agent-errors.test.ts
          npx tsx src/durable-operations-ci.test.ts
          npm run typecheck
          npm run build
          npm test
          git diff --check
      - name: Commit bounded implementation and self-remove helper
        run: |
          set -euo pipefail
          rm .github/workflows/wave2-boundary-bootstrap.yml
          git diff --check
          test "$(git status --short | grep -c 'wave2-boundary-bootstrap.yml' || true)" -le 1
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src docs package.json .github/workflows/wave2-boundary-bootstrap.yml
          git commit -m 'refactor: resolve development boundary wave 2'
          git push origin HEAD:codex/devspace-development-boundaries-wave2-20260914
