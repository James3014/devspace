name: Nexus Core issue completion

# Two-job consumer workflow for the Nexus Core issue gate.
# - 'run' produces and Sigstore-signs the receipt (needs id-token: write).
# - 'verify' is the required check: it verifies the signature against THIS
#   workflow file on the default branch and checks the receipt against the exact
#   head, base config and Issue.
# Requires container isolation ([isolation] mode = "container") in the
# repository's committed .nexus-core/config.toml. See
# docs/GITHUB_REPOSITORY_CHECK.md.
#
# Actions and nexus-certify-ref are pinned to one full 40-hex commit sha of
# James3014/nexus-core (never a tag/branch).
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read
  pull-requests: read

concurrency:
  group: nexus-core-issue-completion-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  run:
    name: Nexus Core issue run
    # Same-repository branches only; fork PRs are intentionally excluded.
    # This repository is itself a GitHub fork, so `head.repo.fork` is true for every
    # same-repository branch; the same-repository identity check alone excludes fork PRs.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      issues: read
      pull-requests: read
      id-token: write   # required for Sigstore keyless signing
    outputs:
      artifact-name: ${{ steps.gate.outputs.artifact-name }}
      issue-number: ${{ steps.gate.outputs.issue-number }}
    steps:
      - id: gate
        uses: James3014/nexus-core/.github/actions/issue-gate@8fd7548605bb3b5d1b8695dd37acb18d5a2f1147  # pin: full 40-hex nexus-core commit
        with:
          nexus-certify-ref: "8fd7548605bb3b5d1b8695dd37acb18d5a2f1147"  # same sha as above

  verify:
    name: Nexus Core issue completion   # the required status check
    needs: run
    if: always() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - uses: James3014/nexus-core/.github/actions/receipt-verify@8fd7548605bb3b5d1b8695dd37acb18d5a2f1147  # pin: same sha
        with:
          artifact-name: ${{ needs.run.outputs.artifact-name }}
          # This very workflow file, on the default branch.
          expected-identity: https://github.com/James3014/devspace/.github/workflows/nexus-core-issue-completion.yml@refs/heads/main
          github-repository: ${{ github.repository }}
          head-sha: ${{ github.event.pull_request.head.sha }}
          base-sha: ${{ github.event.pull_request.base.sha }}
          issue-number: ${{ needs.run.outputs.issue-number }}
          nexus-certify-ref: "8fd7548605bb3b5d1b8695dd37acb18d5a2f1147"  # same sha
