name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  diff-check:
    name: Diff check (PR)
    if: github.event_name == 'pull_request'
    runs-on: macos-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Git diff check
        run: git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"

  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Enforce development boundaries
        run: npx tsx src/development-boundaries.test.ts

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

  chat-swarm-continuation:
    name: Chat Swarm continuation ${{ matrix.name }} (macOS)
    runs-on: macos-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: coordinator
            file: src/chat-swarm-continuation-coordinator.test.ts
          - name: durable-store
            file: src/chat-swarm-continuation-store.test.ts
          - name: restart-fence
            file: src/chat-swarm-continuation-restart-fence.test.ts
          - name: retired-carrier
            file: src/chat-swarm-continuation-stale-carrier.test.ts
          - name: terminal-replay
            file: src/chat-swarm-continuation-terminal-replay.test.ts
          - name: corruption-fence
            file: src/chat-swarm-continuation-corruption-fence.test.ts
          - name: aggregate-domain
            file: src/chat-swarm-continuation-domain.test.ts

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run focused continuation test
        run: npx tsx ${{ matrix.file }}

  local-agent-sessions:
    name: Local agent sessions (macOS)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test local agent sessions
        run: npm run test:local-agent-sessions
