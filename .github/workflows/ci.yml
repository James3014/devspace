name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest

    env:
      DEVSPACE_ALLOWED_ROOTS: ${{ github.workspace }}
      DEVSPACE_OAUTH_OWNER_TOKEN: ci-owner-token-that-is-long-enough
      DEVSPACE_PUBLIC_BASE_URL: http://127.0.0.1:7676

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Pi sandbox dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y ripgrep bubblewrap socat
          if sysctl kernel.apparmor_restrict_unprivileged_userns >/dev/null 2>&1; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        env:
          DEVSPACE_REQUIRE_PI_SANDBOX: ${{ matrix.os == 'ubuntu-latest' && '1' || '0' }}
        run: npm test

      - name: Build
        run: npm run build

      - name: Doctor
        run: node dist/cli.js doctor

  chat-swarm-continuation:
    name: Chat Swarm continuation focused (macOS)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - id: coordinator
        name: Continuation coordinator
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-coordinator.test.ts

      - id: store
        name: Continuation durable store
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-store.test.ts

      - id: restart_fence
        name: Continuation restart fence
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-restart-fence.test.ts

      - id: stale_carrier
        name: Continuation retired-carrier fence
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-stale-carrier.test.ts

      - id: terminal_replay
        name: Continuation terminal replay
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-terminal-replay.test.ts

      - id: corruption_fence
        name: Continuation corruption fence
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-corruption-fence.test.ts

      - id: domain
        name: Continuation aggregate/domain
        continue-on-error: true
        run: npx tsx src/chat-swarm-continuation-domain.test.ts

      - name: Require focused continuation green
        if: always()
        run: |
          test "${{ steps.coordinator.outcome }}" = "success"
          test "${{ steps.store.outcome }}" = "success"
          test "${{ steps.restart_fence.outcome }}" = "success"
          test "${{ steps.stale_carrier.outcome }}" = "success"
          test "${{ steps.terminal_replay.outcome }}" = "success"
          test "${{ steps.corruption_fence.outcome }}" = "success"
          test "${{ steps.domain.outcome }}" = "success"

  local-agent-sessions:
    name: Local agent sessions (macOS)
    runs-on: macos-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test local agent sessions
        run: npm run test:local-agent-sessions