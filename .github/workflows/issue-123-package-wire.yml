name: Issue 123 latest-main verification

on:
  push:
    branches:
      - codex/issue-123-physical-host-registry-g1-clean
    paths:
      - .github/workflows/issue-123-package-wire.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Verify exact latest-main package base
        run: test "$(git hash-object package.json)" = "0e7643b8cdc42f31ecab094cc8ed66106703a9d0"
      - name: Apply exact bounded package patch
        run: node scripts/issue-123-package-wire.mjs
      - name: Verify patch scope
        shell: bash
        run: |
          test "$(git diff --name-only)" = "package.json"
          git diff --check
          git diff -- package.json
      - run: npm ci
      - run: npm run test:physical-host-registry
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  apply:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Reconcile exact branch head
        shell: bash
        run: |
          git fetch origin codex/issue-123-physical-host-registry-g1-clean
          test "$(git rev-parse origin/codex/issue-123-physical-host-registry-g1-clean)" = "${GITHUB_SHA}"
          test "$(git hash-object package.json)" = "0e7643b8cdc42f31ecab094cc8ed66106703a9d0"
      - name: Apply exact bounded package patch
        run: node scripts/issue-123-package-wire.mjs
      - name: Verify and commit only package wiring
        shell: bash
        run: |
          test "$(git diff --name-only)" = "package.json"
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "test: wire physical host registry into full suite"
          git push origin HEAD:codex/issue-123-physical-host-registry-g1-clean
